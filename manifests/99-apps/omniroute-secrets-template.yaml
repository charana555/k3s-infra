---
# OmniRoute Encryption Keys Template
# DO NOT COMMIT WITH REAL VALUES
# Generate encryption key: openssl rand -hex 32

apiVersion: v1
kind: Secret
metadata:
  name: omniroute-encryption
  namespace: apps
type: Opaque
stringData:
  # REQUIRED: AES-256-GCM key for encrypting provider credentials at rest
  # Generate with: openssl rand -hex 32
  # CRITICAL: Back up this key separately - losing it means losing all provider credentials
  storage-encryption-key: "REPLACE_WITH_64_CHAR_HEX_KEY"
  
  # OPTIONAL: Separate key for API key encryption (if not set, uses storage-encryption-key)
  # api-key-secret: "REPLACE_WITH_ANOTHER_64_CHAR_HEX_KEY"

---
# Optional: Provider API Keys (if you want to pre-configure via env vars)
# OmniRoute Dashboard is the recommended way to add providers
# Keys added via Dashboard are encrypted in SQLite and take precedence over env vars

