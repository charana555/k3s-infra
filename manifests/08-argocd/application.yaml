---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3s-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/charana555/k3s-infra.git
    targetRevision: main
    path: manifests
    directory:
      # Without recurse, ArgoCD only reads YAML directly in manifests/ and
      # skips all subdirectories - every app here lives in a subdirectory,
      # so the app was silently empty ("Synced" with 0 resources managed).
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # headlamp-admin is a kubernetes.io/service-account-token Secret: the
  # token controller populates /data and adds a service-account.uid
  # annotation after creation. Ignore those controller-owned fields or
  # the app never converges.
  ignoreDifferences:
  - group: ""
    kind: Secret
    name: headlamp-admin
    namespace: monitoring
    jsonPointers:
    - /data
    - /metadata/annotations/kubernetes.io~1service-account.uid
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
